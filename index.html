<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>広告ブロッカー検知 v2</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --danger: #f87171;
    --safe: #4ade80;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
  p.desc {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
    text-align: center;
  }
  .status {
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    font-weight: bold;
    font-size: 1.05rem;
    text-align: center;
    transition: all 0.3s ease;
  }
  .status.loading { background: rgba(148,163,184,0.15); color: var(--muted); }
  .status.detected { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid var(--danger); }
  .status.clear { background: rgba(74,222,128,0.15); color: var(--safe); border: 1px solid var(--safe); }
  .icon { font-size: 2rem; display: block; margin-bottom: 6px; }

  .checklist { list-style: none; padding: 0; margin: 0 0 20px 0; }
  .checklist li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(148,163,184,0.15);
    font-size: 0.85rem;
  }
  .checklist li:last-child { border-bottom: none; }
  .badge {
    font-size: 0.75rem;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .badge.pending { background: rgba(148,163,184,0.2); color: var(--muted); }
  .badge.blocked { background: rgba(248,113,113,0.2); color: var(--danger); }
  .badge.allowed { background: rgba(74,222,128,0.2); color: var(--safe); }

  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  .footer { margin-top: 16px; font-size: 0.72rem; color: var(--muted); text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <h1>🛡️ 広告ブロッカー検知 v2</h1>
    <p class="desc">MV3型拡張機能(uBlock Origin Liteなど)にも対応した多層検知</p>

    <div id="status" class="status loading">
      <span class="icon">⏳</span>検査中...
    </div>

    <ul class="checklist" id="checklist">
      <li>CSSコスメティックフィルタ <span class="badge pending" id="b-cosmetic">待機中</span></li>
      <li>広告用bait画像の読み込み <span class="badge pending" id="b-image">待機中</span></li>
      <li>既知広告スクリプトの読込 <span class="badge pending" id="b-script">待機中</span></li>
      <li>ネットワークリクエスト遮断 <span class="badge pending" id="b-network">待機中</span></li>
    </ul>

    <button onclick="runDetection()">再検査する</button>

    <div class="footer">
      MV3ベースの拡張機能はネットワークリクエストをブラウザ内部で静かに遮断するため、
      CSS非表示・画像読み込み・スクリプト読み込みの複数シグナルを組み合わせて判定しています。
    </div>
  </div>

  <script>
    function setBadge(id, state, label) {
      const el = document.getElementById(id);
      el.className = 'badge ' + state;
      el.textContent = label;
    }

    // 1. CSSコスメティックフィルタ検知: uBOがよく隠す典型クラス名を大量に試す
    async function checkCosmetic() {
      const classNames = [
        'adsbygoogle', 'ad-banner', 'ads-container', 'ad_unit', 'advertisement',
        'text-ad', 'sponsored-post', 'google-ad', 'banner-ad', 'ad-slot',
        'pub_300x250', 'sidebar-ads', 'ad-wrapper', 'adsbox'
      ];
      const container = document.createElement('div');
      container.style.cssText = 'position:absolute; top:-9999px; left:-9999px;';
      let hiddenCount = 0;

      const elements = classNames.map(cls => {
        const el = document.createElement('div');
        el.className = cls;
        el.style.cssText = 'width:300px; height:250px;';
        el.textContent = '.';
        container.appendChild(el);
        return el;
      });
      document.body.appendChild(container);

      await new Promise(r => setTimeout(r, 150));

      for (const el of elements) {
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden' ||
            el.offsetHeight === 0 || el.offsetParent === null) {
          hiddenCount++;
        }
      }
      document.body.removeChild(container);
      return hiddenCount; // 隠された数を返す
    }

    // 2. bait画像: 広告配信ドメインの実画像URL(1x1やロゴ等)を読み込ませる
    function checkImage() {
      return new Promise((resolve) => {
        const img = new Image();
        let done = false;
        const timer = setTimeout(() => {
          if (!done) { done = true; resolve(true); } // タイムアウト=ブロックとみなす
        }, 2000);
        img.onload = () => {
          if (!done) { done = true; clearTimeout(timer); resolve(false); }
        };
        img.onerror = () => {
          if (!done) { done = true; clearTimeout(timer); resolve(true); }
        };
        // Googleの広告配信画像(既知のEasyList収録パス)
        img.src = 'https://pagead2.googlesyndication.com/pagead/gen_204?id=itest&' + Date.now();
      });
    }

    // 3. 既知広告スクリプトの読込テスト
    function checkScript() {
      return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = 'https://www.googletagservices.com/tag/js/gpt.js?' + Date.now();
        let done = false;
        const timer = setTimeout(() => {
          if (!done) { done = true; resolve(true); }
        }, 2000);
        script.onload = () => {
          if (!done) { done = true; clearTimeout(timer); resolve(false); }
        };
        script.onerror = () => {
          if (!done) { done = true; clearTimeout(timer); resolve(true); }
        };
        document.body.appendChild(script);
      });
    }

    // 4. fetchでの複数の既知広告/トラッキングURLへのアクセス試行
    async function checkNetwork() {
      const testUrls = [
        'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js',
        'https://www.googletagservices.com/tag/js/gpt.js',
        'https://securepubads.g.doubleclick.net/tag/js/gpt.js'
      ];
      let blockedCount = 0;
      for (const url of testUrls) {
        try {
          const controller = new AbortController();
          const t = setTimeout(() => controller.abort(), 1500);
          await fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store', signal: controller.signal });
          clearTimeout(t);
          // no-corsは成功しても中身は見えないが、例外が出ずに解決すればネットワーク到達はできている
        } catch (e) {
          blockedCount++;
        }
      }
      return blockedCount; // 3件中いくつ失敗したか
    }

    async function runDetection() {
      const statusEl = document.getElementById('status');
      statusEl.className = 'status loading';
      statusEl.innerHTML = '<span class="icon">⏳</span>検査中...';
      ['b-cosmetic','b-image','b-script','b-network'].forEach(id => setBadge(id, 'pending', '検査中'));

      const [cosmeticHidden, imageBlocked, scriptBlocked, networkBlockedCount] = await Promise.all([
        checkCosmetic(),
        checkImage(),
        checkScript(),
        checkNetwork()
      ]);

      setBadge('b-cosmetic', cosmeticHidden > 0 ? 'blocked' : 'allowed',
        cosmeticHidden > 0 ? `${cosmeticHidden}件 非表示` : '検出なし');
      setBadge('b-image', imageBlocked ? 'blocked' : 'allowed', imageBlocked ? 'ブロック' : '読込成功');
      setBadge('b-script', scriptBlocked ? 'blocked' : 'allowed', scriptBlocked ? 'ブロック' : '読込成功');
      setBadge('b-network', networkBlockedCount > 0 ? 'blocked' : 'allowed',
        networkBlockedCount > 0 ? `${networkBlockedCount}/3 失敗` : '全て到達');

      const score = (cosmeticHidden > 0 ? 1 : 0) + (imageBlocked ? 1 : 0) +
                    (scriptBlocked ? 1 : 0) + (networkBlockedCount > 0 ? 1 : 0);

      const statusEl2 = document.getElementById('status');
      if (score >= 1) {
        statusEl2.className = 'status detected';
        statusEl2.innerHTML = `<span class="icon">🚫</span>広告ブロッカーを検知しました<br><span style="font-weight:normal;font-size:0.78rem;color:var(--muted)">4手法中 ${score} 件でブロックを検出</span>`;
      } else {
        statusEl2.className = 'status clear';
        statusEl2.innerHTML = '<span class="icon">✅</span>広告ブロッカーは検知されませんでした';
      }
    }

    window.addEventListener('load', () => setTimeout(runDetection, 300));
  </script>
</body>
</html>
