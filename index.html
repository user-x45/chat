<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>広告ブロッカー検知</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --danger: #f87171;
    --safe: #4ade80;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 8px;
  }
  p.desc {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .status {
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    font-weight: bold;
    font-size: 1.1rem;
    transition: all 0.3s ease;
  }
  .status.loading {
    background: rgba(148,163,184,0.15);
    color: var(--muted);
  }
  .status.detected {
    background: rgba(248,113,113,0.15);
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .status.clear {
    background: rgba(74,222,128,0.15);
    color: var(--safe);
    border: 1px solid var(--safe);
  }
  .icon {
    font-size: 2.2rem;
    display: block;
    margin-bottom: 8px;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  .footer {
    margin-top: 20px;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🛡️ 広告ブロッカー検知</h1>
    <p class="desc">複数の手法を組み合わせて、ブラウザで広告ブロッカーが有効かどうかを判定します。</p>

    <div id="status" class="status loading">
      <span class="icon">⏳</span>
      検査中...
    </div>

    <button onclick="runDetection()">再検査する</button>

    <div class="footer">
      ダミー広告要素 / フェッチブロック / スクリプトブロックの3つの方法で判定しています。
    </div>
  </div>

  <!-- 広告ブロッカーが反応しやすいクラス名のダミー要素 -->
  <div class="ads ad-banner adsbox advertisement" style="position:absolute; left:-9999px; width:1px; height:1px;"></div>

  <script>
    async function checkBaitElement() {
      const bait = document.createElement('div');
      bait.className = 'ads ad-banner adsbox pub_300x250 pub_300x250m banner-ads ad-placement carbon-ads';
      bait.style.cssText = 'position:absolute; top:-9999px; left:-9999px; width:1px; height:1px;';
      document.body.appendChild(bait);
      // レイアウト確定を待つ
      await new Promise(r => setTimeout(r, 100));
      const blocked = bait.offsetHeight === 0 ||
                       bait.offsetParent === null ||
                       getComputedStyle(bait).display === 'none' ||
                       getComputedStyle(bait).visibility === 'hidden';
      document.body.removeChild(bait);
      return blocked;
    }

    async function checkFetchBlock() {
      const testUrls = [
        'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js',
        'https://googleads.g.doubleclick.net/pagead/id'
      ];
      for (const url of testUrls) {
        try {
          await fetch(url, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
          return false; // 成功したらブロックされていない
        } catch (e) {
          // このURLは失敗、次を試す
        }
      }
      return true; // 全て失敗＝ブロックされている可能性が高い
    }

    async function checkScriptBlock() {
      return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
        let resolved = false;
        const timer = setTimeout(() => {
          if (!resolved) { resolved = true; resolve(true); }
        }, 1500);
        script.onload = () => {
          if (!resolved) { resolved = true; clearTimeout(timer); resolve(false); }
        };
        script.onerror = () => {
          if (!resolved) { resolved = true; clearTimeout(timer); resolve(true); }
        };
        document.body.appendChild(script);
      });
    }

    async function runDetection() {
      const statusEl = document.getElementById('status');
      statusEl.className = 'status loading';
      statusEl.innerHTML = '<span class="icon">⏳</span>検査中...';

      const [baitBlocked, fetchBlocked, scriptBlocked] = await Promise.all([
        checkBaitElement(),
        checkFetchBlock(),
        checkScriptBlock()
      ]);

      const score = [baitBlocked, fetchBlocked, scriptBlocked].filter(Boolean).length;
      const detected = score >= 1;

      if (detected) {
        statusEl.className = 'status detected';
        statusEl.innerHTML = `<span class="icon">🚫</span>広告ブロッカーを検知しました<br><span style="font-weight:normal;font-size:0.8rem;color:var(--muted)">判定根拠: ${score}/3 の手法で検出</span>`;
      } else {
        statusEl.className = 'status clear';
        statusEl.innerHTML = '<span class="icon">✅</span>広告ブロッカーは検知されませんでした';
      }
    }

    window.addEventListener('load', () => {
      setTimeout(runDetection, 300);
    });
  </script>
</body>
</html>
